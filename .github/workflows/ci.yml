name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

  test:
    name: Test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 earns its place: `local_hostname()` in
        # src/commands/download.rs reads $HOSTNAME and /etc/hostname, which are
        # absent on macOS, and falls back to the `hostname` command there. A
        # Linux-only matrix covers one branch of it.
        runner: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --locked fails when Cargo.lock is out of date, which catches a version
      # bump that moved Cargo.toml without refreshing the lock.
      - run: cargo test --locked
