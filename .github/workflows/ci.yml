name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Pinned: the pedantic lint set changes with every stable release, so a
      # floating toolchain turns an untouched tree red on rustc's schedule.
      # Bump this deliberately, with the lint fixes in the same commit. The test
      # jobs below track stable.
      #
      # The version is an input rather than the action ref because the ref is a
      # branch name, and branches exist for Rust releases that have not shipped.
      # Dependabot reads those as available and proposes a toolchain that 404s.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

  test:
    name: Test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 earns its place: `local_hostname()` in
        # src/commands/download.rs reads $HOSTNAME and /etc/hostname, which are
        # absent on macOS, and falls back to the `hostname` command there. A
        # Linux-only matrix covers one branch of it.
        runner: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # --locked fails when Cargo.lock is out of date, which catches a version
      # bump that moved Cargo.toml without refreshing the lock.
      - run: cargo test --locked

  installer:
    name: Installer tests (node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares, 24 is what the release workflow
        # publishes with. Both ends get exercised.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # The suite has no dependencies: it drives bin/install.mjs against a
      # fixture HTTP server on localhost, so there is nothing to install.
      - run: npm test
