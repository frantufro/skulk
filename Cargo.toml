[package]
name = "skulk"
version = "0.7.1"
edition = "2024"
description = "Manage remote Claude Code agents over SSH with tmux and git worktrees"
license = "MIT"
repository = "https://github.com/frantufro/skulk"
homepage = "https://github.com/frantufro/skulk"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "7"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
toml = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
serial_test = "4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
